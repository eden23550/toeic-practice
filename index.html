<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>多益單字練習</title>
  <meta name="description" content="多益單字練習 App：間隔複習、KK 音標、發音與練習紀錄。">
  <meta name="theme-color" content="#0f766e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="多益單字">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // 在畫面出現前套用使用者選的外觀（深色／淺色），避免打開時先閃一下白色
    (function () {
      try {
        var theme = (JSON.parse(localStorage.getItem('toeic-practice-v1') || '{}').settings || {}).theme;
        if (theme === 'dark' || theme === 'light') document.documentElement.setAttribute('data-theme', theme);
      } catch (e) { /* 讀不到就跟隨系統 */ }
    })();
  </script>
  <script>
    // 記錄執行時發生的錯誤，可以在「設定 → 問題回報」複製給開發者。
    // 放在所有程式之前，才能連載入單字庫時的錯誤也抓到。
    (function () {
      var KEY = 'toeic-practice-errors';
      function log(msg, src, stack) {
        try {
          var list = JSON.parse(localStorage.getItem(KEY) || '[]');
          list.push({ time: new Date().toISOString(), msg: String(msg).slice(0, 300), src: src || '', stack: String(stack || '').slice(0, 600) });
          localStorage.setItem(KEY, JSON.stringify(list.slice(-20)));
        } catch (e) { /* 儲存空間不可用 */ }
      }
      window.addEventListener('error', function (e) {
        log(e.message, (e.filename || '').split('/').pop() + ':' + e.lineno + ':' + e.colno, e.error && e.error.stack);
      });
      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason;
        log('Unhandled promise: ' + (r && r.message ? r.message : r), '', r && r.stack);
      });
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <noscript>請開啟 JavaScript 才能使用這個 App。</noscript>
  <script src="js/words.js"></script>
  <script src="js/phrases.js"></script>
  <script src="js/toeic.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
